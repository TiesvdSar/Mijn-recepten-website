<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Mijn recepten collectie</title>
    <link rel="stylesheet" href="styles/main_style.css">
</head>
<body>
    <header>
        <h1>🍽 Mijn recepten collectie</h1>
        <p>Recepten van vrienden, familie en mezelf — om te delen en altijd bij de hand te hebben.</p>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Zoek een recept...">
        </div>

        <div class="filter-controls">
            <div class="filter-section">
                <label for="categoryFilter">Categorie</label>
                <select id="categoryFilter" onchange="applyFilters()">
                    <option value="Alle">Alle</option>
                </select>
            </div>

            <div class="filter-section">
                <label for="timeFilter">Bereidingstijd</label>
                <select id="timeFilter" onchange="applyFilters()">
                    <option value="all">Elke tijd</option>
                    <option value="15">≤ 15 min</option>
                    <option value="30">≤ 30 min</option>
                    <option value="60">≤ 1 uur</option>
                </select>
            </div>

            <div class="filter-section">
                <label for="servingsFilter">Personen</label>
                <select id="servingsFilter" onchange="applyFilters()">
                    <option value="all">Elk aantal</option>
                    <option value="1-2">1–2 personen</option>
                    <option value="3-4">3–4 personen</option>
                    <option value="5+">5+ personen</option>
                </select>
            </div>

            <button class="clear-filters-btn" onclick="clearFilters()">Filters wissen</button>
            <button class="random-btn" onclick="openRandomRecipe()">🎲 Willekeurig recept</button>
        </div>

        <div class="filters" id="filters"></div>

        <div class="recipes-grid" id="recipesGrid"></div>

        <div class="no-results" id="noResults" style="display: none;">
            Geen recepten gevonden. Probeer een andere zoekterm of filter.
        </div>
    </div>

    <!-- Recipe modal -->
    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
                <p id="modalDescription"></p>

                <div class="share-buttons">
                    <button onclick="copyRecipeLink()" class="clear-filters-btn" title="Kopieer link">🔗 Kopieer link</button>
                    <button onclick="shareOnWhatsApp()" class="random-btn" title="Deel op WhatsApp">💬 WhatsApp</button>
                    <button onclick="shareViaEmail()" class="clear-filters-btn" title="Deel via e-mail">✉️ E-mail</button>
                </div>

                <h3 class="section-title">Ingrediënten</h3>
                <div class="serving-adjuster">
                    <label>Aantal personen:</label>
                    <div class="serving-controls">
                        <button class="serving-btn" id="decreaseServing" onclick="adjustServings(-1)">−</button>
                        <span class="serving-count" id="currentServings"></span>
                        <button class="serving-btn" id="increaseServing" onclick="adjustServings(1)">+</button>
                    </div>
                </div>
                <ul class="ingredients-list" id="modalIngredients"></ul>

                <h3 class="section-title">Bereidingswijze</h3>
                <ol class="instructions-list" id="modalInstructions"></ol>
            </div>
        </div>
    </div>

    <script src="recepten.js"></script>

    <script>
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        let currentRecipe = null;
        let currentServingSize = 4;
        let currentFilters = {
            category: 'Alle',
            maxTime: 'all',
            servings: 'all',
            search: ''
        };

        // Parse ingredient and scale quantity
        function scaleIngredient(ingredient, scale) {
            const numberRegex = /(\d+\.?\d*\/?\d*\.?\d*)/g;

            return ingredient.replace(numberRegex, function(match) {
                let value;
                if (match.includes('/')) {
                    const parts = match.split('/');
                    value = parseFloat(parts[0]) / parseFloat(parts[1]);
                } else {
                    value = parseFloat(match);
                }

                const scaled = value * scale;

                if (scaled % 1 === 0) return scaled.toString();

                const fractions = { 0.25: '¼', 0.33: '⅓', 0.5: '½', 0.67: '⅔', 0.75: '¾' };
                const whole = Math.floor(scaled);
                const decimal = scaled - whole;

                for (let [dec, frac] of Object.entries(fractions)) {
                    if (Math.abs(decimal - parseFloat(dec)) < 0.05) {
                        return whole > 0 ? `${whole} ${frac}` : frac;
                    }
                }

                return scaled.toFixed(1);
            });
        }

        function adjustServings(change) {
            currentServingSize += change;
            if (currentServingSize < 1) currentServingSize = 1;
            updateIngredientsDisplay();
        }

        function updateIngredientsDisplay() {
            if (!currentRecipe) return;
            const scale = currentServingSize / currentRecipe.servings;
            document.getElementById('currentServings').textContent = currentServingSize;
            document.getElementById('decreaseServing').disabled = currentServingSize <= 1;
            document.getElementById('modalIngredients').innerHTML = currentRecipe.ingredients
                .map(ing => `<li>${escapeHTML(scaleIngredient(ing, scale))}</li>`).join('');
        }

        function getCategories() {
            const categories = new Set();
            recipes.forEach(r => {
                const cats = Array.isArray(r.categories) ? r.categories : (r.category ? [r.category] : []);
                cats.forEach(cat => categories.add(cat));
            });
            return ['Alle', ...Array.from(categories).sort()];
        }

        function parseTimeToMinutes(timeStr) {
            const match = timeStr.match(/(\d+)\s*min/);
            return match ? parseInt(match[1]) : 0;
        }

        function applyFilters() {
            currentFilters.category = document.getElementById('categoryFilter').value;
            currentFilters.maxTime  = document.getElementById('timeFilter').value;
            currentFilters.servings = document.getElementById('servingsFilter').value;
            renderRecipes();
        }

        function clearFilters() {
            currentFilters = { category: 'Alle', maxTime: 'all', servings: 'all', search: '' };
            document.getElementById('categoryFilter').value = 'Alle';
            document.getElementById('timeFilter').value = 'all';
            document.getElementById('servingsFilter').value = 'all';
            document.getElementById('searchInput').value = '';
            renderRecipes();
        }

        function getFilteredRecipes() {
            return recipes.filter(recipe => {
                const matchesCategory = currentFilters.category === 'Alle' ||
                    (Array.isArray(recipe.categories)
                        ? recipe.categories.includes(currentFilters.category)
                        : recipe.category === currentFilters.category);

                let matchesTime = true;
                if (currentFilters.maxTime !== 'all') {
                    const total = parseTimeToMinutes(recipe.prepTime) + parseTimeToMinutes(recipe.cookTime);
                    matchesTime = total <= parseInt(currentFilters.maxTime);
                }

                let matchesServings = true;
                if (currentFilters.servings === '1-2')      matchesServings = recipe.servings <= 2;
                else if (currentFilters.servings === '3-4') matchesServings = recipe.servings >= 3 && recipe.servings <= 4;
                else if (currentFilters.servings === '5+')  matchesServings = recipe.servings >= 5;

                const matchesSearch =
                    recipe.title.toLowerCase().includes(currentFilters.search.toLowerCase()) ||
                    recipe.description.toLowerCase().includes(currentFilters.search.toLowerCase());

                return matchesCategory && matchesTime && matchesServings && matchesSearch;
            });
        }

        function openRandomRecipe() {
            const filtered = getFilteredRecipes();
            if (filtered.length === 0) { alert('Geen recepten gevonden met de huidige filters!'); return; }
            openRecipe(filtered[Math.floor(Math.random() * filtered.length)].id);
        }

        function getRecipeURL() {
            if (!currentRecipe) return window.location.href;
            return `${window.location.origin}${window.location.pathname}?recipe=${currentRecipe.id}`;
        }

        function copyRecipeLink() {
            const url = getRecipeURL();
            navigator.clipboard.writeText(url).then(showCopyNotification).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = url;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showCopyNotification();
            });
        }

        function showCopyNotification() {
            const n = document.createElement('div');
            n.className = 'copy-notification';
            n.textContent = '✓ Link gekopieerd!';
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        function shareOnWhatsApp() {
            if (!currentRecipe) return;
            const url  = encodeURIComponent(getRecipeURL());
            const text = encodeURIComponent(`Kijk eens naar dit recept: ${currentRecipe.title}\n\n`);
            window.open(`https://wa.me/?text=${text}${url}`, '_blank', 'noopener,noreferrer');
        }

        function shareViaEmail() {
            if (!currentRecipe) return;
            const subject = encodeURIComponent(`Recept: ${currentRecipe.title}`);
            const body = encodeURIComponent(
                `Ik vond dit recept en dacht dat je het leuk zou vinden!\n\n` +
                `${currentRecipe.title}\n${currentRecipe.description}\n\n` +
                `Bekijk het volledige recept hier: ${getRecipeURL()}`
            );
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function checkForSharedRecipe() {
            const id = parseInt(new URLSearchParams(window.location.search).get('recipe'));
            if (id && recipes.find(r => r.id === id)) setTimeout(() => openRecipe(id), 500);
        }

        function renderFilters() {}

        function renderRecipes() {
            const grid      = document.getElementById('recipesGrid');
            const noResults = document.getElementById('noResults');
            const filtered  = getFilteredRecipes();

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            grid.innerHTML = filtered.map(recipe => `
                <div class="recipe-card" onclick="openRecipe(${recipe.id})">
                    <div class="recipe-image-wrapper">
                        ${recipe.image
                            ? `<img class="recipe-image" src="${escapeHTML(recipe.image)}" alt="${escapeHTML(recipe.title)}">`
                            : `<div class="recipe-image-placeholder">🍽️</div>`
                        }
                    </div>
                    <div class="recipe-content">
                        <h3 class="recipe-title">${escapeHTML(recipe.title)}</h3>
                        <div class="recipe-meta">
                            <span>⏱️ ${escapeHTML(recipe.prepTime)}</span>
                            <span>🍳 ${escapeHTML(recipe.cookTime)}</span>
                            <span>👥 ${recipe.servings} pers.</span>
                        </div>
                        <p class="recipe-description">${escapeHTML(recipe.description)}</p>
                        <div class="recipe-categories">
                            ${recipe.categories.map(cat => `<span class="recipe-category">${escapeHTML(cat)}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            currentRecipe     = recipe;
            currentServingSize = recipe.servings;

            const img = document.getElementById('modalImage');
            if (recipe.image) {
                img.src   = recipe.image;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }

            document.getElementById('modalTitle').textContent = recipe.title;
            document.getElementById('modalMeta').innerHTML = `
                <span>⏱️ Voorbereiding: ${escapeHTML(recipe.prepTime)}</span>
                <span>🍳 Kooktijd: ${escapeHTML(recipe.cookTime)}</span>
                <span>👥 ${recipe.servings} personen</span>
            `;
            document.getElementById('modalDescription').textContent = recipe.description;

            updateIngredientsDisplay();

            document.getElementById('modalInstructions').innerHTML =
                recipe.instructions.map(inst => `<li>${escapeHTML(inst)}</li>`).join('');

            document.getElementById('recipeModal').style.display = 'block';

            try {
                window.history.replaceState({}, '', `${window.location.origin}${window.location.pathname}?recipe=${id}`);
            } catch(e) {}
        }

        function closeModal() {
            document.getElementById('recipeModal').style.display = 'none';
            try { window.history.replaceState({}, '', window.location.pathname); } catch(e) {}
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('recipeModal')) closeModal();
        };

        document.getElementById('searchInput').addEventListener('input', function(e) {
            currentFilters.search = e.target.value;
            renderRecipes();
        });

        function init() {
            const categories   = getCategories();
            const categorySelect = document.getElementById('categoryFilter');
            categorySelect.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            renderRecipes();
            checkForSharedRecipe();
        }

        init();
    </script>
</body>
</html>
